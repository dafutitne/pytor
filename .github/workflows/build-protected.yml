name: Build protected Linux
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-protected.yml'
      - 'build_protected.py'
      - 'protection-patch.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 numpy==2.5.2 blake3==1.0.11 pyelftools Cython==3.3.0 cryptography==50.0.2
      - name: Build and verify without a GPU
        run: python build_protected.py
      - uses: actions/upload-artifact@v4
        with:
          name: pytor-protect1-linux
          path: dist/*
